const L=[
{t:"1 · المقدمة",d:`تخيّل أول يوم دوام بشركة أمن سيبراني بكربلاء، والمدير يگلك: «أنت متدرب جديد، وكل مهمة راح تعلمك شي».<br><br><b>البرنامج</b> ورقة تعليمات تعطيها للكمبيوتر وهو ينفذها سطر ورا سطر. وبايثون هي اللغة اللي نكتب بيها هاي التعليمات.<br><b>المتغير</b> مثل علبة عليها ملصق: <code>x = 5</code> يعني حطيت 5 بعلبة اسمها x. إذا كتبت <code>x = 7</code> رميت القديم وحطيت الجديد.<br><b>أنواع القيم</b>: int عدد صحيح (5)، float عدد بفاصلة (5.5)، str نص بين علامتين تنصيص، bool صح أو غلط.<br><b>input</b> تسأل المستخدم، وجوابه يوصلك <u>نص دايماً</u> حتى لو كتب رقم. فإذا تريد تجمعه أو تطرحه لازم تحوله بـ int().<br><b>غلطة تصير هواية</b>: تكتب <code>"5" + 3</code> فيطلع خطأ، لأن نص ما ينجمع مع رقم.`,k:["البوابة","الحارس يريد برنامج يسأل الموظف عن اسمه وعمره، ويطبع له كم راح يصير عمره بعد 5 سنين.","# اكتب الكود هنا\n",'name = input("شنو اسمك؟ ")\nage = int(input("شكد عمرك؟ "))\nprint("هلا", name, "- بعد 5 سنين عمرك", age + 5)',"<b>السطر 1:</b> input تسأل وتخزن الجواب بـ name.<br><b>السطر 2:</b> الجواب يجي نص، فلفّيناه بـ int() حتى نگدر نجمع عليه.<br><b>السطر 3:</b> print تطبع عدة أشياء بفواصل، و age + 5 تنحسب قبل الطباعة. بدون int() راح يطلع TypeError."],c:[
["OOP شنو؟","تخيّل سيارة: عدها لون وسرعة (هاي بيانات) وتگدر تمشي وتوگف (هاي سلوك). OOP يعني نبني البرنامج من أشياء مثل هاي. الفايروول بعد: عنده IP وStatus، وعنده BlockIP().",""],
["المتغيرات","المتغير مثل صندوق عليه اسم. ما تحتاج تكتب نوعه، بايثون يعرفه بنفسه (dynamic). الاسم ما يبدي برقم، وحساس للحروف: NAME غير name.",'a = 100\nx = "python"\nn, m, w = 1, 2, "py"'],
["print و input","print تطبع، و input تاخذ من المستخدم. انتبه: input دايماً ترجّع نص (str).",'name = input("اسمك؟ ")\nprint("هلا", name)'],
["الأنواع والتحويل","int وfloat وstr وbool وlist وtuple وdict وset وNone. تفحص النوع بـ type(x) وتحوّل بـ int() وstr().",'type(5/2)   # float\nint("20")   # 20'],
["العمليات","/ دايماً تطلع float، // قسمة صحيحة، % الباقي، ** الأس.","10 // 3  # 3\n10 % 3   # 1\n2 ** 3   # 8"]],
q:[["x=10, y=3\nprint(x // y)",["3.33","3","1","4"],1,"// تشيل الكسر."],["أي اسم متغير غلط؟",["num_1","_num","2num","NUM"],2,"ما يبدي برقم."],["print(type(5/2))",["int","float","str","complex"],1,"/ دايماً float."],["بايثون لغة...",["dynamically typed","لازم تعلن النوع","ما تدعم OOP","compiled فقط"],0,"النوع يتحدد وقت التشغيل."],["print(10 % 3)",["3","1","0","3.33"],1,"الباقي 1."]]},
{t:"2 · أنواع البيانات",d:`الأنواع هنا مثل أدوات تخزين بمخزن الشركة:<br>• <b>List</b> رف بيه أغراض مرقمة تبدي من <b>0</b>، وتگدر تضيف وتشيل وتبدل.<br>• <b>Tuple</b> صندوق مقفول، تحط بيه وتسكّره وما تنفتح.<br>• <b>Dict</b> دفتر تلفونات: تدور بالاسم (المفتاح) وتلگى الرقم (القيمة).<br>• <b>Set</b> كيس بلا تكرار، لو حطيت نفس الشي 10 مرات يبقى واحد.<br><br><b>Slicing</b>: <code>s[1:4]</code> يعني «ابدأ من 1 وتوقف قبل 4»، يعني الحرف رقم 4 مو داخل. والسالب يعدّ من الآخر: -1 آخر حرف.<br><b>غلطة شائعة</b>: تحاول تعدل tuple فيطلع TypeError، والحل تحوله لـ list.`,k:["قائمة المشبوهين","النظام سجّل IPs هواية منها مكررة. نظّفها من التكرار، رتبها، واطبع القائمة وعددها.",'ips = ["10.0.0.1","10.0.0.2","10.0.0.1","10.0.0.3","10.0.0.2"]\n# كمّل\n','ips = ["10.0.0.1","10.0.0.2","10.0.0.1","10.0.0.3","10.0.0.2"]\nunique = list(set(ips))\nunique.sort()\nprint(unique)\nprint("العدد:", len(unique))',"<b>set(ips)</b> يشيل التكرار تلقائياً.<br><b>list(...)</b> نرجعها قائمة لأن set بلا ترتيب وما تدعم sort.<br><b>sort()</b> ترتب تصاعدياً، و <b>len</b> تعطي العدد (3)."],c:[
["Slicing للنص","الفهرس يبدي من 0. s[1:4] ياخذ من 1 لحد قبل 4. السالب يعدّ من الآخر.",'s = "Hello, World!"\ns[1:8]   # ello, W\ns[-3:]   # ld!'],
["List","قائمة تتغير (mutable) بين [ ]. أهم أوامرها: append وextend وinsert وremove وpop وsort وreverse وlen.","li = [3, 1, 2]\nli.append(9)\nli.sort()   # [1, 2, 3, 9]"],
["Tuple","مثل list بس ثابتة (immutable) وبين ( ). ما تگدر تعدل بيها.","t = (1, 2, 3)\nt[0] = 9   # TypeError"],
["Dict و Set","dict مفتاح:قيمة، و get ترجّع None إذا المفتاح ماكو. set بلا تكرار وبلا ترتيب وتدعم union وintersection.",'d = {"a": 1}\nd.get("z")        # None\n{1,2,3} & {3,4}   # {3}']],
w:"slice",
q:[['s = "Python"\nprint(s[1:4])',["Pyt","yth","ytho","yt"],1,"من 1 لحد قبل 4."],['print("Python"[-1])',["P","n","o","Error"],1,"-1 آخر حرف."],["t=(1,2,3)\nt[0]=9",["يتعدل","TypeError","[9,2,3]","None"],1,"Tuple ثابت."],['d={"a":1}\nprint(d.get("z"))',["Error","0","None","a"],2,"get ما تعطي خطأ."],["print(len(set([1,1,2,2,3])))",["5","3","2","1"],1,"set يشيل التكرار."],["l=[3,1,2]\nl.sort()\nprint(l)",["[3,1,2]","[1,2,3]","[3,2,1]","None"],1,"sort ترتّب تصاعدي."]]},
{t:"3 · الشروط والحلقات",d:`<b>الشرط</b> مثل نقطة تفتيش: «إذا عمرك فوق 18 مرّ، وإلا ارجع». بايثون يفحص بالترتيب وينفذ أول شرط صحيح بس.<br><b>المسافة البادئة</b> (4 فراغات) هي اللي تگول لبايثون شنو داخل الشرط، وإذا غلطت بيها يطلع IndentationError.<br><b>for</b> تمشي على عدد معروف من العناصر، مثل حارس يفحص كل سيارة بالطابور.<br><b>while</b> تكرر لين يتحقق شرط، مثل «سوّي محاولة لين تنجح». لازم شي يغير الشرط وإلا حلقة لا نهائية.<br><b>break</b> تفتح الباب وتطلع، <b>continue</b> تقفز للدورة الجاية.`,k:["قفل الباب","الباب كلمته السرية 1234. يعطونك 3 محاولات بس، وإذا فشلت تنقفل وتطبع «انقفل!».","# استخدم while و break\n",'tries = 0\nwhile tries < 3:\n    pw = input("الباسورد: ")\n    if pw == "1234":\n        print("تفضل!")\n        break\n    tries += 1\nelse:\n    print("انقفل!")',"<b>tries</b> عداد المحاولات.<br><b>while tries < 3</b> تكرر 3 مرات كحد أقصى.<br>إذا الباسورد صح نطبع ونسوي <b>break</b> فتطلع الحلقة وما يشتغل else.<br>إذا غلط نزيد العداد. وإذا خلصت المحاولات من دون break يشتغل <b>else</b> ويطبع «انقفل!»."],c:[
["if / elif / else","بايثون يفحص الشروط بالترتيب وينفذ أول واحد صحيح وبعدها يطلع. المسافات البادئة (indentation) مهمة هواية.","score = 85\nif score >= 90: print('A')\nelif score >= 80: print('B')\nelse: print('F')"],
["and / or / not","and لازم الشرطين صح، or يكفي واحد، not يعكس النتيجة.","x > 0 and y > 0\nnot (5 < 2)   # True"],
["for و range","range(1,11) تعطي 1 لحد 10، النهاية مو داخلة. for تمشي على كل عنصر.","for n in range(1, 11):\n    if n % 2 != 0: print(n)"],

q:[["print(list(range(2,5)))",["[2,3,4,5]","[2,3,4]","[3,4,5]","[2,5]"],1,"النهاية مو داخلة."],["score=85\nif score>=90:print('A')\nelif score>=80:print('B')\nelse:print('F')",["A","B","F","A و B"],1,"أول شرط صحيح هو >=80."],["for i in range(3):\n  print(i,end=' ')\nelse:\n  print('done')",["0 1 2 done","0 1 done","done","0 1 2"],0,"ما صار break."],["print(not (5<2))",["True","False","None","Error"],0,"5<2 خطأ، و not تعكسه."],["while count>0: print(count)\n(بدون count -= 1)",["ينتهي","حلقة لا نهائية","Error","يطبع مرة"],1,"الشرط ما يتغير."],["شنو يسوي continue؟",["يوقف البرنامج","يقفز للدورة الجاية","يطلع من الحلقة","يعيد من الأول"],1,"يتخطى الدورة الحالية."]]},
{t:"4 · الدوال",d:`الدالة مثل ماكنة قهوة: تدخل بيها (مياه وبن) وتطلع لك (قهوة). تكتبها مرة وتستعملها ألف مرة.<br><b>def</b> تعلن الماكنة، و<b>parameters</b> المدخلات، و<b>return</b> المخرجات. إذا ما كتبت return تطلع None.<br><b>Scope</b>: المتغير داخل الدالة مثل غرض داخل غرفة مغلقة، الخارج ما يشوفه.<br><b>Default</b>: إذا ما مررت قيمة ياخذ الافتراضية. <b>*args</b>: تستقبل أي عدد من القيم.`,k:["فاحص الباسورد","اكتب دالة check_password(p) ترجع «قوية» إذا طولها 8 أو أكثر وإلا «ضعيفة»، وجربها على قيمتين.","def check_password(p):\n    # كمّل\n",'def check_password(p):\n    if len(p) >= 8:\n        return "قوية"\n    return "ضعيفة"\n\nprint(check_password("abc"))\nprint(check_password("Cyber1234"))',"<b>len(p)</b> تعطي عدد الحروف.<br>إذا الشرط صح نرجع «قوية» والدالة تنتهي فوراً، وإذا لا نكمل للسطر الأخير.<br>نستعمل <b>return</b> بدل print حتى نگدر نستخدم النتيجة بمكان ثاني."],c:[
